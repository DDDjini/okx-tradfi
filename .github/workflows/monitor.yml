name: OKX TradFi Monitor v2

# 每 10 分钟跑一轮
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Restore data cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: okx-data-v4-${{ github.run_id }}
          restore-keys: |
            okx-data-v4-

          - name: Diagnose OKX API
        run: |
          python -c "
          import requests,time
          s=requests.Session(); s.verify=False
          import urllib3; urllib3.disable_warnings()
          try:
            r=s.get('https://www.okx.com/api/v5/public/time',timeout=15)
            print(f'OKX API: {r.status_code} -> {r.json()}')
          except Exception as e:
            print(f'OKX FAIL: {e}')
          "

      - name: Run monitor scan (fresh)
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          echo "FEISHU_WEBHOOK=${FEISHU_WEBHOOK}" > .env
          echo "FEISHU_SECRET=" >> .env
          echo "PROXY_URL=" >> .env
          mkdir -p data
          # 每轮强制清 pushed_cache → 看真实信号量
          echo '[]' > data/pushed_cache.json
          python -u monitor.py --once 2>&1

      - name: Save data cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: okx-data-v4-${{ github.run_id }}
