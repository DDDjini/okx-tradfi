name: OKX TradFi Monitor

# 每 10 分钟跑一轮
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Restore data cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: okx-data-v4-${{ github.run_id }}
          restore-keys: |
            okx-data-v4-

      - name: Run monitor scan
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          echo "FEISHU_WEBHOOK=${FEISHU_WEBHOOK}" > .env
          echo "FEISHU_SECRET=" >> .env
          echo "PROXY_URL=" >> .env
          mkdir -p data
          [ ! -f data/pushed_cache.json ] && echo '[]' > data/pushed_cache.json
          python -u monitor.py --once 2>&1

      - name: Save data cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: okx-data-v4-${{ github.run_id }}
