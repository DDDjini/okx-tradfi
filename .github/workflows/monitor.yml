name: OKX TradFi Monitor

# 每 10 分钟跑一轮
# 每天 144 次 × 每次 ~30 秒 = 72 分钟/天 = 2160 分钟/月（公开仓库免费无限）

on:
  schedule:
    - cron: "*/10 * * * *"
  # 手动触发（调试验证用）
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # 单次最多 8 分钟，超时自动杀

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt

      - name: Cache K-line data
        uses: actions/cache@v4
        with:
          path: data/
          key: yahoo-kline-v2-${{ github.ref_name }}

      - name: Run monitor scan
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          echo "FEISHU_WEBHOOK=${FEISHU_WEBHOOK}" > .env
          echo "FEISHU_SECRET=" >> .env
          echo "PROXY_URL=" >> .env
          mkdir -p data
          python -u monitor.py --once 2>&1
