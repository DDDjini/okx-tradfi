name: OKX TradFi Monitor

# 每 30 分钟跑一轮（30m K线收盘后刚好覆盖）
# GitHub 免费版: 公开仓库无限额度, 私有仓库 2000分钟/月
# 每次运行约 2-3 分钟, 30分钟一次 = 每天 48 次 = 144分钟/天 = 4320分钟/月
# 建议用公开仓库（策略本身不敏感），如果有私密信息用 Secrets

on:
  schedule:
    # UTC 时间：每 :00 和 :30 触发（对齐 30m/1h K线收盘）
    # 加 1 分钟偏移让交易所数据就绪
    - cron: "1,31 * * * *"
  # 手动触发（调试验证用）
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # 单次最多 8 分钟，超时自动杀

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install pandas numpy pyyaml python-dotenv requests urllib3 yfinance

      - name: Cache K-line data
        uses: actions/cache@v4
        with:
          path: data/
          key: kline-data-v1-${{ github.ref_name }}-${{ hashFiles('config.yaml') }}
          restore-keys: kline-data-v1-

      - name: Run monitor scan
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          # 用 GitHub Secrets 注入飞书 webhook
          echo "FEISHU_WEBHOOK=${FEISHU_WEBHOOK}" > .env
          echo "FEISHU_SECRET=" >> .env
          echo "PROXY_URL=" >> .env
          
          # 跑一轮扫描
          python monitor.py --once
