name: OKX TradFi Monitor v2

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Diagnose OKX API
        run: |
          python -c "import requests,urllib3;urllib3.disable_warnings();
          s=requests.Session();s.verify=False
          try:
            r=s.get('https://www.okx.com/api/v5/public/time',timeout=15)
            print('OKX API:',r.status_code,r.json())
          except Exception as e:
            print('OKX FAIL:',e)"

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: okx-data-v4-${{ github.run_id }}
          restore-keys: okx-data-v4-

      - name: Run monitor scan
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          echo "FEISHU_WEBHOOK=${FEISHU_WEBHOOK}" > .env
          echo "FEISHU_SECRET=" >> .env
          echo "PROXY_URL=" >> .env
          mkdir -p data
          echo '[]' > data/pushed_cache.json
          python -u monitor.py --once 2>&1

      - name: Save data cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: okx-data-v4-${{ github.run_id }}