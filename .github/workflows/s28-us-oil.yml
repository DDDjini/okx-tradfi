name: US and oil S28 monitor
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: us-oil-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: codex_us_oil_monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Scan and notify
        env:
          FEISHU_WEBHOOK: ${{ secrets.S28_FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
        run: python scanner.py --send
      - name: Persist successful notification receipts
        if: always()
        run: |
          mkdir -p state
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "Update notification receipts [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-report
          path: codex_us_oil_monitor/scan_output.json
          retention-days: 14
