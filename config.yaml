# ============================================================
#  OKX TradFi 股票代币 分型策略监控系统 — 配置文件
#  基于 2026-07-28 网格搜索(1.0-3.0)+理论对比(缠论/波浪)+止损截断 综合优化
# ============================================================

# --- 监控交易对（17个股票代币，数据源: Yahoo Finance 2年+）---
symbols:
  - AAPL/USDT:USDT
  - MSFT/USDT:USDT
  - GOOGL/USDT:USDT
  - AMZN/USDT:USDT
  - TSLA/USDT:USDT
  - NVDA/USDT:USDT
  - INTC/USDT:USDT
  - MU/USDT:USDT
  - TSM/USDT:USDT
  - SPCX/USDT:USDT
  - SAMSUNG/USDT:USDT
  - SKHYNIX/USDT:USDT
  - XAU/USDT:USDT
  - CL/USDT:USDT
  - XAG/USDT:USDT
  - SNDK/USDT:USDT
  - OPENAI/USDT:USDT

# --- 分型参数（RR 经 630 组网格搜索优化）---
# RR最优区间: 1.7-2.0（平衡胜率和收益）
# RR < 1.5 → 胜率高但收益低（赚不够）
# RR > 2.5 → 收益高但胜率暴跌（等不到）
timeframes:
  "30m":
    left: 2
    right: 2
    rr: 1.4            # 短周期高胜率优先
    sl_buffer: 0.001
  "1h":
    left: 2
    right: 2
    rr: 1.7
    sl_buffer: 0.002
  "4h":
    left: 3
    right: 3
    rr: 1.8
    sl_buffer: 0.003

# --- 过滤器选择 ---
# PSY+EMA：最佳（38.8%胜率, 3.9%收益, 12/28盈利）
# PSY+EMA+缠论：过度过滤（30.2%胜率, -0.14%收益）→ 不推荐
# PSY+EMA+波浪：接近但稍差（37.9%胜率, 2.7%收益）→ 可选
# 6%止损截断：损害收益（-2.4%）→ 不推荐
filters:
  psy_ema: true            # PSY 心理线 + EMA7/34 双均线（核心）
  chan_theory: false       # 缠论（不推荐，过度过滤）
  elliott_wave: false      # 波浪理论（可选，接近PSY+EMA效果）
  max_sl_pct: 0            # 最大止损比例（0=不限制，6%截断损害收益）

# --- 交易所 ---
exchange:
  name: okx
  limit: 300

# --- 手续费 ---
fee:
  rate: 0.0005

# --- 风控 ---
risk:
  account_size: 10000
  risk_per_trade: 0.01
  signal_cooldown_sec: 28800
  max_signals_per_day: 4

# --- 监控循环 ---
monitor:
  fetch_delay_sec: 8               # K线收盘后等待秒数（确保交易所数据就绪）
  # 智能轮询：只在30m/1h/4h/1d K线收盘时触发扫描，其他时间休眠
  smart_polling: true

# --- 日志 ---
logging:
  level: INFO
  file: logs/monitor.log
